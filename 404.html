<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Segmentation fault</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" id="fav" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #181818; color: #d6d6d6; font: 15px/1.7 "JetBrains Mono", monospace; padding: 24px; }
    pre { margin: 0; white-space: pre-wrap; }
    .r { color: #ff7b72; } .m { color: #7a7a7a; } .g { color: #7ee787; } .a { color: #e3b341; }
    a { color: #79c0ff; }
  </style>
</head>
<body>
<pre><span class="g">$</span> ./portfolio <span id="p"></span>
<span class="r">Segmentation fault (core dumped)</span>

<span class="m">Program received signal SIGSEGV.</span>
<span class="m">#0</span> <span class="a">0x0000000000000404</span> in page_lookup(): no such page
<span class="m">#1</span> <span class="a">0x00007ffd5e1c0000</span> in main()

<span class="g">$</span> cd <a href="/" id="home">~</a>   <span class="m"># go back home</span></pre>
<script>
  document.getElementById("p").textContent = location.pathname;

  // The site can live at the root (monarch-69.github.io/) or in a repo folder
  // (monarch-69.github.io/portfolio/). Find which one, so "home" and the icon work.
  (function () {
    var seg = location.pathname.split("/")[1];
    var use = function (base) {
      document.getElementById("home").href = base;
      document.getElementById("fav").href = base + "assets/favicon.svg";
    };
    if (!seg) return use("/");
    fetch("/" + seg + "/assets/favicon.svg", { method: "HEAD" })
      .then(function (r) { use(r.ok ? "/" + seg + "/" : "/"); })
      .catch(function () { use("/"); });
  })();
</script>
</body>
</html>
